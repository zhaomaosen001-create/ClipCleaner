name: Build Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "打包平台"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build macOS package
        run: |
          chmod +x scripts/build_mac.sh
          ./scripts/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCleaner-macOS
          path: |
            dist/ClipCleaner-macOS.dmg
            dist/ClipCleaner-macOS.zip

  build-windows:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows package
        run: scripts\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCleaner-Windows
          path: |
            dist/ClipCleaner.exe
            dist/ClipCleaner-Windows.zip
